# Actions are pinned to a commit, with the tag they came from in a trailing
# comment, so that a moving tag cannot change what CI executes. These pins have
# to be updated by hand: the pinact in the dev shell only understands bare
# GitHub `owner/repo` references, and errors out on the full URLs that Forgejo
# needs for actions hosted outside the instance.

name: test

# The workflow has to be on the default branch for the manual trigger to show
# up in the UI, where it appears as a "Run workflow" button on the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  reuse:
    runs-on: nixos-do-s
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Every file needs an SPDX header and every license a file in LICENSES/,
      # which is easy to forget when adding one. The version that runs here is
      # whatever the flake's nixpkgs pins, so it moves with `nix flake update`
      # rather than with whatever a release of the tool does on its own.
      - name: Check REUSE compliance
        run: nix develop -c reuse lint

  test:
    # Gated on the licensing check, so a missing SPDX header fails without
    # spending three builds on the run.
    needs: reuse
    runs-on: nixos-do-s
    # One job per optimize mode rather than three builds in sequence, so the
    # three run concurrently and each gets its own budget -- a droplet is
    # reaped at a two hour lifetime cap, and a serial run spends that budget
    # three times over on one machine. The job appears once per mode, as
    # `test (Debug)` and so on, and `needs: test` elsewhere waits for all of
    # them.
    strategy:
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseFast]
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No setup-zig step: the compiler comes from the flake's dev shell, which
      # is the same one used locally, so CI cannot silently build with a
      # different Zig than the one the tree was developed against.
      #
      # The runner has no hidraw nodes, so the two tests that talk to hardware
      # find nothing: "read-only ioctls against attached devices" reports
      # SkipZigTest and "enumerate" iterates an empty directory. What this
      # actually proves is that every declaration still compiles, which the
      # refAllDecls tests reach even for methods no test calls.
      #
      # Debug and ReleaseSafe keep the safety checks that catch overflow and
      # out-of-bounds access, while ReleaseFast drops them and can expose
      # different behaviour. Only the Debug job also runs the docs server's
      # tests; build.zig leaves them out of the other two, where they would
      # re-run the same host binary.
      - name: Test
        run: |
          nix develop -c zig version
          nix develop -c zig build test -Doptimize=${{ matrix.optimize }} --summary all

      - name: Check Zig formatting compliance
        run: nix develop -c zig fmt --check .

  check:
    # Compiles the library for every supported target without linking it, so
    # that a backend nobody on this runner can execute still has to compile.
    # Debug only: this proves compilation rather than behaviour, so running it
    # once per optimize mode would buy nothing.
    needs: reuse
    runs-on: nixos-do-s
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compile for every supported target
        run: nix develop -c zig build check --summary all

  vm:
    # The only job that proves anything about behaviour rather than about
    # compilation. A runner has no HID hardware, so `zig build test` above
    # finds an empty device list and skips everything that wants a device;
    # here the suite invents a device through `/dev/uhid` and then talks to it
    # through the library, so what it asserts is exact.
    #
    # `/dev/uhid` is root-only, which is the whole reason this needs a virtual
    # machine rather than another step in `test`. A NixOS VM test needs a
    # runner that can boot a guest, which is what the ephemeral DigitalOcean
    # tiers are and what the always-on runner deliberately is not.
    needs: reuse
    runs-on: nixos-do-s
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the NixOS virtual machine tests
        run: nix flake check --print-build-logs

  docs:
    # Publishes the generated API reference to
    # https://jeff.jcollie.page/zig-hidapi/ .
    #
    # This lives in the same workflow as the tests because `needs` only refers
    # to jobs within one workflow; a separate file could not wait on them. The
    # tests have to be green first, so a build that no longer compiles never
    # replaces the published documentation.
    needs: [check, test, vm]
    # ...and only from the default branch, or any pushed branch would publish
    # over the live site.
    if: ${{ forge.ref == 'refs/heads/main' }}
    runs-on: nixos-do-s
    steps:
      - name: Check out
        uses: https://code.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the API documentation
        run: nix develop -c zig build docs

      # git-pages-cli uploads the directory to the pages server; nothing is
      # committed back into the repository, so the ~17 MB of `sources.tar` that
      # Zig's autodoc emits on every build does not accumulate in git history.
      # `--upload-dir` is incremental, so a push that changed one file uploads
      # one file. The site URL matches this repository, so the automatic
      # Actions token authorizes it and no secret of its own is needed.
      - name: Publish the API documentation
        run: >
          nix develop -c git-pages-cli https://jeff.jcollie.page/zig-hidapi/
          --server jcollie.page
          --token ${{ forge.token }}
          --upload-dir zig-out/docs
